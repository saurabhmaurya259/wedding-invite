name: Wedding invite validation

on:
  push:
    branches:
      - preferred-design-work
  pull_request:
    branches:
      - preferred-design-work

permissions:
  contents: read

concurrency:
  group: wedding-invite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run wedding data tests
        run: npm test

      - name: Check code quality
        run: npm run lint

      - name: Build production assets
        run: npm run build
